<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">
                <i class="fas fa-balance-scale"></i>
                法鼎鸣声
            </a>
           <ul class="nav-links">
               <li><a href="index.html">首页</a></li>
               <li><a href="law.html">法律法规</a></li>
               <li><a href="search.html" class="active">判例经纬</a></li>
               <li><a href="teaching.html">教学资源</a></li>
               <li><a href="paper.html">论文辅助写作</a></li>
               <li><a href="question.html">提问板块</a></li>
           </ul>
        </div>
    </nav>
    
    <section class="hero">
        <div class="hero-content">
            <h1>判例经纬</h1>
            <p>探索司法实践中的智慧与规律</p>
            <div class="law-buttons">
                <a href="#frontier" class="btn">法鼎前沿</a>
                <a href="#comparison" class="btn">经纬纵横</a>
            </div>
        </div>
    </section>
    
    <div class="container">
        <h2 class="section-title">判例搜索</h2>
        <div class="search-container">
            <form id="case-search-form">
                <input type="text" id="case-search-input" placeholder="请输入关键词" required>
                <select id="region">
                    <option value="">全部地区</option>
                    <option value="beijing">北京市</option>
                    <option value="shanghai">上海市</option>
                    <option value="guangdong">广东省</option>
                    <!-- 其他省份选项 -->
                </select>
                <select id="court-level">
                    <option value="">全部级别</option>
                    <option value="supreme">最高人民法院</option>
                    <option value="high">高级人民法院</option>
                    <option value="intermediate">中级人民法院</option>
                    <option value="basic">基层人民法院</option>
                </select>
                <button type="submit" id="case-search-btn"><i class="fas fa-search"></i> 搜索</button>
            </form>
        </div>
        
        <!-- 法鼎前沿部分 -->
        <div class="subsection" id="frontier">
            <h3><i class="fas fa-star"></i> 法鼎前沿</h3>
            <p class="subsection-description">精选近10年具有代表性的热点案例，反映司法实践最新动态</p>
            <div class="results">
                <div id="hot-cases-list">
                    <!-- 热点案例列表将在这里显示 -->
                    <div class="case-card">
                        <h4>网络平台数据权益保护案</h4>
                        <p class="case-meta">最高人民法院 | 2023年 | 民事</p>
                        <p class="case-desc">明确了数据权益的权属认定和保护规则，对互联网行业发展具有指导意义...</p>
                        <a href="#" class="case-link">查看详情 <i class="fas fa-chevron-right"></i></a>
                    </div>
                    <!-- 更多案例卡片 -->
                </div>
            </div>
        </div>
        
        <!-- 经纬纵横部分 -->
        <div class="subsection" id="comparison">
            <h3><i class="fas fa-map-marked-alt"></i> 经纬纵横</h3>
            <p class="subsection-description">比较不同地区、级别法院对同类案件的裁判标准与司法观点</p>
            <div class="results">
                <div class="comparison-tabs">
                    <button class="tab-btn active" data-tab="civil-comparison">民事案例比较</button>
                    <button class="tab-btn" data-tab="criminal-comparison">刑事案例比较</button>
                    <button class="tab-btn" data-tab="admin-comparison">行政案例比较</button>
                </div>
                <div id="case-comparison-content">
                    <!-- 案例比较内容将在这里显示 -->
                </div>
            </div>
        </div>
    </div>
    
   <footer>
       <div class="footer-content">
           <p>© 2025 法鼎鸣声 | 致力于法律智能检索与知识服务</p>
           <div class="footer-links">
               <a href="#"><i class="fas fa-info-circle"></i> 关于我们</a>

               <a href="#"><i class="fas fa-envelope"></i> 联系我们</a>
           </div>
       </div>
   </footer>
    <script src="scripts.js"></script>
</body>
</html>
